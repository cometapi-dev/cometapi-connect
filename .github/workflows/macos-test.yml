name: macOS test downloads

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMETAPI_TEST_NATIVE_CREDENTIALS: '0'

concurrency:
  group: macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
            artifact: macos-arm64
          - runner: macos-15-intel
            architecture: x64
            artifact: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt "pyinstaller==6.22.2" "pytest>=8,<9"
          python -m pip install --no-deps -e .
      - name: Verify browser language matching
        run: node tests/i18n.test.cjs

      - name: Run isolated tests without API credentials
        run: python -m pytest -q --junitxml test-results.xml
      - name: Build DMG and run bundled configuration checks
        run: python scripts/build_release.py --mac-arch native
      - name: Upload macOS test download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cometapi-connect-${{ matrix.artifact }}
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.artifact }}
          path: test-results.xml
          if-no-files-found: ignore
