name: Code quality and Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMETAPI_TEST_NATIVE_CREDENTIALS: '0'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install static checker
        run: python -m pip install ruff==0.16.8
      - name: Lint Python
        run: ruff check cometapi_helper tests scripts integrations launch.py
      - name: Check Python formatting
        run: ruff format --check cometapi_helper tests scripts integrations launch.py
      - name: Check generated media adapters
        run: python scripts/sync_media_assets.py --check
      - name: Check JavaScript syntax
        shell: bash
        run: git ls-files -z '*.js' '*.cjs' | xargs -0 -r -n 1 node --check

  linux-tests:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install application and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run isolated tests without API credentials
        run: python -m pytest -q
      - name: Verify browser language matching
        run: node tests/i18n.test.cjs

  linux-build:
    name: Linux x64 standalone build
    needs: [quality, linux-tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt "pyinstaller==6.22.2"
          python -m pip install --no-deps -e .
      - name: Build standalone executable and verify isolated configuration
        run: python scripts/build_release.py
      - name: Upload Linux test download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cometapi-connect-linux-x64
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 30
