name: Windows test download

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMETAPI_TEST_NATIVE_CREDENTIALS: '0'

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements.txt "pyinstaller==6.22.2" "pytest>=8,<9"
          python -m pip install --no-deps -e .
      - name: Verify browser language matching
        run: node tests/i18n.test.cjs

      - name: Verify all interface languages in Edge
        env:
          BROWSER_CHANNEL: msedge
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          node tests/i18n-browser.cjs

      - name: Run isolated tests without API credentials
        run: python -m pytest -q --basetemp C:\ct --junitxml test-results.xml
      - name: Build standalone EXE and run bundled configuration checks
        run: python scripts/build_release.py
      - name: Upload Windows test download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cometapi-connect-windows-x64
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results
          path: test-results.xml
          if-no-files-found: ignore
