[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cometapi-connect"
version = "0.1.3"
description = "Detect AI apps and configure supported clients for CometAPI locally"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "CometAPI"}]
maintainers = [{name = "CometAPI", email = "support@cometapi.com"}]
requires-python = ">=3.9.2,<3.15"
keywords = ["cometapi", "desktop", "configuration", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["tomlkit==0.13.3", "ruamel.yaml==0.18.16", "json5==0.15.0", "certifi==2026.7.22", 'cryptography==50.0.1; sys_platform != "darwin"', 'plyvel-ci==1.5.1; python_version < "3.13"', 'plyvel-next==2.1.2; python_version >= "3.13"']

[project.urls]
Homepage = "https://www.cometapi.com/"
Repository = "https://github.com/cometapi-dev/cometapi-connect"
Documentation = "https://github.com/cometapi-dev/cometapi-connect#readme"
Issues = "https://github.com/cometapi-dev/cometapi-connect/issues"
Security = "https://github.com/cometapi-dev/cometapi-connect/blob/main/SECURITY.md"

[project.scripts]
cometapi-connect = "cometapi_helper.cli:main"

[tool.setuptools.package-data]
cometapi_helper = ["*.json", "static/*.html", "static/*.js", "static/locales/*.json", "assets/*.py", "assets/*.zip", "assets/roo_bridge/*.cjs", "assets/roo_bridge/*.json", "assets/copilot_bridge/*.cjs", "assets/copilot_bridge/*.json"]

[tool.setuptools.packages.find]
include = ["cometapi_helper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff==0.16.8"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["build", "dist", "docs", ".venv", ".release-venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/browser_i18n_server.py" = ["E402"]
